name: Build & Deploy Gamelyd

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/gamelyd/gamelyd
  GITOPS_REPO: Gamelyd/gitops

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=https://gamelyd.co
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          ref: main

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tags
        env:
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          yq -i ".gamelyd.image.tag = strenv(TAG)" deploy/helm/stack/values.yaml
          yq -i ".gamelyd.image.repository = \"ghcr.io/gamelyd/gamelyd\"" deploy/helm/stack/values.yaml
          for env_file in environments/*/values.yaml; do
            yq -i ".gamelyd.image.tag = strenv(TAG)" "$env_file"
            yq -i ".gamelyd.image.repository = \"ghcr.io/gamelyd/gamelyd\"" "$env_file"
          done

      - name: Commit and push GitOps main
        env:
          SOURCE_COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual workflow_dispatch' }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add deploy/helm/stack/values.yaml environments
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: update gamelyd image to ${{ needs.build-and-push.outputs.image_tag }}" \
            -m "source commit: ${SOURCE_COMMIT_MESSAGE}"
          git push origin main
